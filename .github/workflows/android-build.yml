name: Build Railway Static GK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply UI improvements without changing quiz data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("app/src/main/assets/index.html")
          css_path = Path("app/src/main/assets/modern-enhancements.css")
          js_path = Path("app/src/main/assets/next-focus-mode.js")
          html = html_path.read_text(encoding="utf-8")
          assert html.strip().lower().startswith("<!doctype html"), "Quiz HTML missing"
          assert css_path.is_file() and css_path.stat().st_size > 0, "Modern CSS missing"
          assert js_path.is_file() and js_path.stat().st_size > 0, "Focus-mode JS missing"
          assert html.lower().count("</head>") == 1, "Unexpected HTML head structure"
          assert html.lower().count("</body>") == 1, "Unexpected HTML body structure"

          if "modern-enhancements.css" not in html:
              html = re.sub(r"</head>", '  <link rel="stylesheet" href="modern-enhancements.css">\n</head>', html, count=1, flags=re.I)

          if "next-focus-mode.js" not in html:
              html = re.sub(r"</body>", '  <script src="next-focus-mode.js"></script>\n</body>', html, count=1, flags=re.I)

          assert "restoreResumePosition();" in html, "Existing quiz script unexpectedly missing"
          assert "modern-enhancements.css" in html
          assert "next-focus-mode.js" in html
          html_path.write_text(html, encoding="utf-8")
          print("Quiz data preserved; responsive styling and focus-mode controls attached.")
          print(f"HTML bytes: {html_path.stat().st_size}; CSS bytes: {css_path.stat().st_size}; JS bytes: {js_path.stat().st_size}")
          PY

      - name: Build installable debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: railway-static-gk-installable-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
